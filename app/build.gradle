apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'tech.touka.amapnavi'
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "tech.touka.amapnavi"
        minSdkVersion 19          // 库斯途原厂 Android 4.4.3 (KitKat)
        targetSdkVersion 22       // 彻底绕过运行时权限弹窗，安装即授予全部权限
        versionCode 32
        versionName "1.4.0-custo"

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a"   // NXP i.MX6 32 位 ARM
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    testImplementation 'junit:junit:4.13.2'
}
