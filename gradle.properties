# No org.gradle.java.home here — JDK17 is provided via JAVA_HOME / PATH before running gradle.
# No sdk.dir in local.properties — SDK path comes from ANDROID_HOME env var.
# Keep this file ASCII-only: Windows reads .properties in system encoding (GBK),
# any non-ASCII path here would be corrupted before Gradle sees it.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.overridePathCheck=true
android.enableJetifier=true
kotlin.code.style=official
